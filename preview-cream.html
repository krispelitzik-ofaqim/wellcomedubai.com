<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>השוואת גוון הרקע</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:Heebo,sans-serif; padding:0; }
  .swatch { padding:30px 22px; text-align:right; border-bottom:2px solid rgba(0,0,0,0.08); }
  .hex { font-size:1.4rem; font-weight:900; letter-spacing:1px; direction:ltr; text-align:right; color:#1A4A5E; }
  .label { font-size:0.95rem; color:#6B7F8D; margin-top:4px; }
  .sample { background:#fff; border-radius:10px; padding:14px; margin-top:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); border:1px solid rgba(0,0,0,0.06); }
  .sample-title { font-weight:900; color:#1A6B8A; font-size:1rem; }
  .sample-text { color:#2C5F6E; font-size:0.85rem; margin-top:4px; }
</style>
</head>
<body>
  <div class="swatch" style="background:#F5E6CB;">
    <div class="hex">#F5E6CB</div>
    <div class="label">הצבע הנוכחי</div>
    <div class="sample">
      <div class="sample-title">דוגמה לתוכן</div>
      <div class="sample-text">כך נראה כרטיס לבן על הרקע</div>
    </div>
  </div>
  <div class="swatch" style="background:#F0DFB8;">
    <div class="hex">#F0DFB8</div>
    <div class="label">חלופה כהה יותר (קרם חם)</div>
    <div class="sample">
      <div class="sample-title">דוגמה לתוכן</div>
      <div class="sample-text">כך נראה כרטיס לבן על הרקע</div>
    </div>
  </div>
  <div class="swatch" style="background:#EAD8B0;">
    <div class="hex">#EAD8B0</div>
    <div class="label">חלופה הכהה ביותר (קרם נטיבי יותר)</div>
    <div class="sample">
      <div class="sample-title">דוגמה לתוכן</div>
      <div class="sample-text">כך נראה כרטיס לבן על הרקע</div>
    </div>
  </div>
  <div class="swatch" style="background:#FDF6EC;">
    <div class="hex">#FDF6EC</div>
    <div class="label">חלופה בהירה (פסטל קלאסי)</div>
    <div class="sample">
      <div class="sample-title">דוגמה לתוכן</div>
      <div class="sample-text">כך נראה כרטיס לבן על הרקע</div>
    </div>
  </div>
</body>
</html>
